  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.02)]"><div class="h-16 px-gutter-sm flex items-center justify-between"><button aria-label="Dismiss" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-on-surface-variant transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">expand_more</span></button><div class="flex flex-col items-center justify-center max-w-[200px]"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant text-[10px] tracking-widest leading-none truncate">PLAYING FROM ALBUM</span><span class="font-headline-sm text-headline-sm text-on-surface truncate mt-1 text-[13px] leading-tight font-medium">Now Playing</span></div><div class="flex items-center"><button aria-label="Options" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-on-surface-variant transition-colors"><span class="material-symbols-outlined text-[20px]">more_horiz</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-1"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-safe">

<div class="flex items-center justify-between pt-space-xs pb-space-sm">

<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest text-[10px]">96KHZ • 24-BIT LOSSLESS</span>
</div>
<div class="flex items-center gap-1 text-on-surface-variant font-mono-metric text-mono-metric">
<span class="text-[11px] text-secondary">DAC OUT</span>
<span class="font-semibold text-[11px] text-on-surface tracking-wider">BITPERFECT</span>
</div>
</div>
<!-- Central Album Artwork Display -->
<div class="w-full flex items-center justify-center my-space-md">
<div class="relative w-full max-w-[328px] aspect-square rounded-[24px] overflow-hidden bg-surface-container shadow-md group">
<img class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-[1.02]" data-alt="Minimalist architectural concrete sculpture against an overcast pale ivory sky, brutalist smooth curves, soft natural diffusion, pure monochrome aesthetic, studio medium format photography, ultra sharp clean composition, zen atmosphere." id="artwork-element" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0NBKMW_x4IppVmOJ7NYFxMNB4dTYV-_HND0UdvpfATQDyzRlCbm680IFEKcDoz1IbWJjVYY_EiIPSS72Jp25VMjEPZjULL23-DWIA8GHkSxovxYbx20FgFR_ddsFBfdnnCPeHjNdxcFgD64jrQ2JOjwF6VHG_3r7VLKZqLl3ymG_zS9f-iYO_5wZmTe_O2q4RQsmF41HbgWSMqml8eddjYpU2r9_0kgMu2ehzRDl2MaapCWFtCrUB"/>
<!-- Dynamic Fine Equalizer Overlay for Visual Delight -->
<div class="absolute bottom-3 right-3 px-2.5 py-1 rounded-full bg-surface-container-lowest/80 backdrop-blur-md flex items-end gap-0.5 h-6">
<span class="w-[2px] bg-primary rounded-full transition-all duration-300 h-3.5 animate-[pulse_1s_infinite]"></span>
<span class="w-[2px] bg-primary rounded-full transition-all duration-300 h-5 animate-[pulse_0.7s_infinite_alternate]"></span>
<span class="w-[2px] bg-primary rounded-full transition-all duration-300 h-2.5 animate-[pulse_1.2s_infinite]"></span>
<span class="w-[2px] bg-primary rounded-full transition-all duration-300 h-4 animate-[pulse_0.9s_infinite_alternate]"></span>
</div>
</div>
</div>
<!-- Track Meta Section -->
<div class="flex items-center justify-between mt-space-xs">
<div class="min-w-0 pr-space-sm">
<h1 class="font-headline-md text-headline-md text-on-surface font-medium truncate tracking-tight">Written on the Sky</h1>
<p class="font-body-md text-body-md text-secondary truncate mt-0.5">Max Richter — The Blue Notebooks</p>
</div>
<button aria-label="Add to Favorites" class="w-11 h-11 flex-shrink-0 rounded-full flex items-center justify-center text-on-surface hover:text-primary transition-transform active:scale-90" id="favorite-btn" onclick="toggleFavorite(this)">
<span class="material-symbols-outlined text-[24px]" id="favorite-icon">favorite_border</span>
</button>
</div>
<!-- Audio Timeline Scrubber -->
<div class="mt-space-lg w-full flex flex-col">
<div class="relative w-full h-7 flex items-center cursor-pointer select-none group" id="scrubber-track" onclick="handleScrub(event)">
<!-- Base Background Track -->
<div class="w-full h-[2px] bg-surface-container-highest rounded-full overflow-hidden">
<!-- Progress Active Track -->
<div class="h-full bg-primary rounded-full w-[43%] transition-all duration-150" id="scrubber-fill"></div>
</div>
<!-- Tactile Scrubber Thumb -->
<div class="absolute left-[43%] -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-primary shadow-sm ring-4 ring-surface transition-transform duration-150 group-hover:scale-125" id="scrubber-thumb"></div>
</div>
<div class="flex justify-between items-center -mt-1 font-mono-metric text-mono-metric text-[11px] text-secondary">
<span id="time-current">01:40</span>
<span id="time-total">03:52</span>
</div>
</div>
<!-- Primary Playback Controls Row -->
<div class="flex items-center justify-between mt-space-md px-space-xs">
<!-- Shuffle Toggle -->
<button aria-label="Shuffle" class="w-10 h-10 flex items-center justify-center text-secondary hover:text-on-surface transition-colors active:scale-95" id="shuffle-btn" onclick="toggleShuffle(this)">
<span class="material-symbols-outlined text-[20px]">shuffle</span>
</button>
<!-- Previous Track -->
<button aria-label="Previous Track" class="w-12 h-12 flex items-center justify-center text-on-surface hover:text-primary transition-transform active:scale-90" onclick="triggerHaptic()">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<!-- Master Play/Pause Solid Knob (64px) -->
<button aria-label="Play or Pause" class="w-16 h-16 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm hover:opacity-90 active:scale-95 transition-all" id="master-play-btn" onclick="togglePlayback()">
<span class="material-symbols-outlined text-[32px] translate-x-[0.5px]" id="play-pause-icon" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<!-- Next Track -->
<button aria-label="Next Track" class="w-12 h-12 flex items-center justify-center text-on-surface hover:text-primary transition-transform active:scale-90" onclick="triggerHaptic()">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
<!-- Repeat Mode -->
<button aria-label="Repeat" class="w-10 h-10 flex items-center justify-center text-secondary hover:text-on-surface transition-colors active:scale-95" id="repeat-btn" onclick="toggleRepeat(this)">
<span class="material-symbols-outlined text-[20px]">repeat</span>
</button>
</div>
<!-- Actions Pill Strip -->
<div class="mt-space-lg w-full bg-surface-container rounded-full p-1 flex items-center">
<button class="flex-1 py-2 px-3 rounded-full flex items-center justify-center gap-1.5 transition-colors text-secondary hover:text-on-surface hover:bg-surface-container-high/60 active:scale-95" id="action-lyrics" onclick="activatePill(this)">
<span class="material-symbols-outlined text-[16px]">notes</span>
<span class="font-label-caps text-label-caps text-[11px] uppercase tracking-wider">Lyrics</span>
</button>
<div class="w-[1px] h-3.5 bg-outline-variant/40"></div>
<button class="flex-1 py-2 px-3 rounded-full flex items-center justify-center gap-1.5 transition-colors bg-primary text-on-primary shadow-sm" id="action-spatial" onclick="activatePill(this)">
<span class="material-symbols-outlined text-[16px]">spatial_audio</span>
<span class="font-label-caps text-label-caps text-[11px] uppercase tracking-wider font-semibold">Spatial 8D</span>
</button>
<div class="w-[1px] h-3.5 bg-outline-variant/40"></div>
<button class="flex-1 py-2 px-3 rounded-full flex items-center justify-center gap-1.5 transition-colors text-secondary hover:text-on-surface hover:bg-surface-container-high/60 active:scale-95" id="action-queue" onclick="activatePill(this)">
<span class="material-symbols-outlined text-[16px]">queue_music</span>
<span class="font-label-caps text-label-caps text-[11px] uppercase tracking-wider">Queue</span>
</button>
</div>
<!-- Master Output Endpoint Device Footer -->
<div class="mt-space-md mb-space-sm flex items-center justify-center">
<button class="inline-flex items-center gap-2.5 px-5 py-2.5 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface transition-all active:scale-98 shadow-sm group" onclick="openDevicePicker()">
<span class="material-symbols-outlined text-[18px] text-secondary group-hover:text-primary transition-colors">speaker_group</span>
<span class="font-body-sm text-body-sm font-medium tracking-tight">AirPlay • Devialet Phantom</span>
<span class="w-2 h-2 rounded-full bg-[#10b981] ml-0.5"></span>
</button>
</div>
</div>
<script>
  let isPlaying = true;
  let isFav = false;
  let isShuffle = false;
  let isRepeat = false;

  function togglePlayback() {
    isPlaying = !isPlaying;
    const icon = document.getElementById('play-pause-icon');
    if (isPlaying) {
      icon.textContent = 'pause';
      icon.classList.remove('translate-x-[1px]');
    } else {
      icon.textContent = 'play_arrow';
      icon.classList.add('translate-x-[1px]');
    }
  }

  function toggleFavorite(btn) {
    isFav = !isFav;
    const icon = document.getElementById('favorite-icon');
    if (isFav) {
      icon.textContent = 'favorite';
      icon.style.fontVariationSettings = "'FILL' 1";
      btn.classList.add('text-primary');
    } else {
      icon.textContent = 'favorite_border';
      icon.style.fontVariationSettings = "'FILL' 0";
      btn.classList.remove('text-primary');
    }
  }

  function toggleShuffle(btn) {
    isShuffle = !isShuffle;
    if (isShuffle) {
      btn.classList.remove('text-secondary');
      btn.classList.add('text-primary');
    } else {
      btn.classList.add('text-secondary');
      btn.classList.remove('text-primary');
    }
  }

  function toggleRepeat(btn) {
    isRepeat = !isRepeat;
    if (isRepeat) {
      btn.classList.remove('text-secondary');
      btn.classList.add('text-primary');
    } else {
      btn.classList.add('text-secondary');
      btn.classList.remove('text-primary');
    }
  }

  function handleScrub(e) {
    const track = document.getElementById('scrubber-track');
    const rect = track.getBoundingClientRect();
    const clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
    const percent = (clickX / rect.width) * 100;
    
    document.getElementById('scrubber-fill').style.width = percent + '%';
    document.getElementById('scrubber-thumb').style.left = percent + '%';

    const totalSeconds = 232; // 03:52
    const currentSeconds = Math.floor((percent / 100) * totalSeconds);
    const mins = Math.floor(currentSeconds / 60);
    const secs = currentSeconds % 60;
    document.getElementById('time-current').textContent = 
      String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
  }

  function activatePill(pill) {
    const strip = pill.parentElement;
    const buttons = strip.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.className = "flex-1 py-2 px-3 rounded-full flex items-center justify-center gap-1.5 transition-colors text-secondary hover:text-on-surface hover:bg-surface-container-high/60 active:scale-95";
      const span = btn.querySelector('.font-label-caps');
      if (span) span.classList.remove('font-semibold');
    });
    pill.className = "flex-1 py-2 px-3 rounded-full flex items-center justify-center gap-1.5 transition-colors bg-primary text-on-primary shadow-sm";
    const span = pill.querySelector('.font-label-caps');
    if (span) span.classList.add('font-semibold');
  }

  function triggerHaptic() {
    if (window.navigator && window.navigator.vibrate) {
      window.navigator.vibrate(10);
    }
  }

  function openDevicePicker() {
    triggerHaptic();
  }
</script></main></body></html>
