name: musify
description: Full Spotify-Class Swiss-Minimalist Android Music App with Real-Time 8D Audio.
publish_to: 'none'
version: 1.0.10+11

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core C++ 3D Audio Engine & Background Service (NO media_kit)
  flutter_soloud: ^5.2.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # Free Background Streaming, Decryption & Networking
  dio: ^5.11.1
  pointycastle: ^4.0.0

  # State Management & Dependency Injection
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  rxdart: ^0.28.0

  # Local Database, Library & Settings Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  cached_network_image: ^4.0.4

  # Platform utilities
  connectivity_plus: ^7.3.2
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  url_launcher: ^6.3.1
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  # Fonts are bundled (not fetched at runtime) so the Swiss typographic
  # system renders identically with zero network access.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
